<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0e0d0c;
  --surface:#161513;
  --surface2:#1c1a18;
  --border:rgba(255,255,255,.07);
  --text:#e8e6e2;
  --muted:#7a7774;
  --faint:#3a3835;
  --red:#c0392b;
  --red2:#e74c3c;
  --red-glow:rgba(192,57,43,.18);
  --green:#27ae60;
  --yellow:#e67e22;
  --radius:12px;
  --font:'Inter',sans-serif;
}
html{-webkit-font-smoothing:antialiased;scroll-behavior:smooth}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100dvh;font-size:15px;line-height:1.5}

/* ── BACKGROUND ── */
.bg-mesh{
  position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
}
.bg-mesh::before{
  content:'';position:absolute;inset:0;
  background:
    radial-gradient(ellipse 80% 50% at 50% -10%, rgba(180,30,20,.22) 0%, transparent 70%),
    radial-gradient(ellipse 50% 40% at 100% 20%, rgba(150,20,10,.14) 0%, transparent 60%),
    radial-gradient(ellipse 50% 40% at 0% 80%, rgba(120,15,8,.1) 0%, transparent 60%);
}
.bg-mesh::after{
  content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(
    0deg,transparent,transparent 40px,rgba(255,255,255,.012) 40px,rgba(255,255,255,.012) 41px
  ),repeating-linear-gradient(
    90deg,transparent,transparent 40px,rgba(255,255,255,.012) 40px,rgba(255,255,255,.012) 41px
  );
}

/* ── LAYOUT ── */
.wrap{position:relative;z-index:1;max-width:680px;margin:0 auto;padding:0 16px 64px}

/* ── HEADER ── */
header{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 0 16px;
  border-bottom:1px solid var(--border);
  margin-bottom:24px;
}
.brand{display:inline-flex;align-items:center;gap:10px;text-decoration:none}
.brand-text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-weight:800;font-style:italic;font-size:17px;letter-spacing:-0.02em;color:#e8e6e2;line-height:1}
.header-actions{display:flex;gap:8px}
.icon-btn{
  display:flex;align-items:center;justify-content:center;
  width:36px;height:36px;border-radius:8px;
  border:1px solid var(--border);background:var(--surface);
  color:var(--muted);cursor:pointer;
  transition:color .15s,border-color .15s,background .15s;
}
.icon-btn:hover{color:var(--text);border-color:rgba(255,255,255,.15);background:var(--surface2)}

/* ── SUBSCRIPTION CARD ── */
.sub-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:18px;
  margin-bottom:16px;
}
.sub-header{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.sub-avatar{
  width:38px;height:38px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:700;flex-shrink:0;
}
.sub-avatar.expired{background:rgba(192,57,43,.18);color:var(--red2)}
.sub-avatar.active{background:rgba(39,174,96,.18);color:var(--green)}
.sub-info h2{font-size:14px;font-weight:600;margin:0 0 2px}
.sub-info p{font-size:12px;color:var(--muted);margin:0}
.sub-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sub-field{
  background:var(--surface2);border:1px solid var(--border);
  border-radius:8px;padding:10px 12px;
}
.sub-field label{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);margin-bottom:4px}
.sub-field label svg{flex-shrink:0}
.sub-field span{font-size:13px;font-weight:500}
.status-active{color:var(--green)}
.status-expired{color:var(--red2)}
.status-inactive{color:var(--yellow)}

/* Traffic bar */
.traffic-bar{margin-top:6px;height:3px;background:var(--faint);border-radius:2px;overflow:hidden}
.traffic-fill{height:100%;border-radius:2px;background:var(--red2);transition:width .4s}

/* ── SECTION CARD ── */
.section-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:18px;margin-bottom:12px;
}
.section-card+.section-card{margin-top:8px}
.section-title-row{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:16px;
}
.section-title{font-size:15px;font-weight:700;letter-spacing:-.01em}

/* ── PLATFORM SELECT ── */
.platform-select{
  display:flex;align-items:center;gap:6px;
  background:var(--surface2);border:1px solid var(--border);
  border-radius:8px;padding:6px 10px;
  font-size:13px;font-weight:500;color:var(--text);
  cursor:pointer;min-width:130px;justify-content:space-between;
  position:relative;
}
.platform-select svg{color:var(--muted);flex-shrink:0}
.plat-icon{width:14px;height:14px;flex-shrink:0}

.plat-dropdown{
  position:absolute;top:calc(100% + 6px);right:0;z-index:100;
  background:#1e1c1a;border:1px solid var(--border);
  border-radius:10px;padding:4px;min-width:150px;
  box-shadow:0 12px 32px rgba(0,0,0,.5);
  display:none;
}
.plat-dropdown.open{display:block}
.plat-opt{
  display:flex;align-items:center;gap:8px;
  padding:8px 10px;border-radius:6px;cursor:pointer;font-size:13px;
  transition:background .12s;
}
.plat-opt:hover{background:var(--surface)}
.plat-opt.active{color:var(--red2)}

/* ── CLIENT TABS ── */
.ctabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.ctab{
  position:relative;overflow:hidden;
  display:flex;align-items:center;gap:8px;
  padding:9px 12px;border-radius:8px;cursor:pointer;
  background:var(--surface2);border:1px solid var(--border);
  font-size:13px;font-weight:500;color:var(--muted);
  transition:all .15s;flex:1;min-width:120px;max-width:calc(50% - 3px);
}
.ctab:hover{color:var(--text);border-color:rgba(255,255,255,.12)}
.ctab.on{
  background:rgba(192,57,43,.1);border-color:rgba(192,57,43,.35);
  color:var(--text);
}
.ctab-dot{
  width:7px;height:7px;border-radius:50%;flex-shrink:0;
  background:var(--faint);
}
.ctab.on .ctab-dot{background:var(--red2)}
.ctab-name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Background logo */
.ctab-logo{
  position:absolute;right:-2px;top:50%;transform:translateY(-50%);
  width:54px;height:54px;opacity:.14;pointer-events:none;
}
.ctab.on .ctab-logo{opacity:.5}
.ctab-logo img{width:54px;height:54px;object-fit:contain;border-radius:10px;display:block}
.ctab-logo svg{width:54px;height:54px;color:var(--text)}

/* ── STEP CARDS ── */
.step-card{
  background:var(--surface2);border:1px solid var(--border);
  border-radius:10px;padding:16px;margin-bottom:8px;
}
.step-card:last-child{margin-bottom:0}
.step-header{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.step-icon{
  width:36px;height:36px;border-radius:9px;flex-shrink:0;
  background:rgba(192,57,43,.12);border:1px solid rgba(192,57,43,.2);
  display:flex;align-items:center;justify-content:center;color:var(--red2);
}
.step-title{font-size:13px;font-weight:600}
.step-desc{font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:10px}
.step-actions{display:flex;flex-wrap:wrap;gap:6px}

/* ── BUTTONS ── */
.btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:8px 14px;border-radius:7px;font-size:13px;font-weight:500;
  cursor:pointer;border:1px solid var(--border);
  background:var(--surface);color:var(--text);
  transition:all .15s;text-decoration:none;white-space:nowrap;
}
.btn:hover{background:var(--surface2);border-color:rgba(255,255,255,.15)}
.btn-primary{
  background:var(--red);border-color:var(--red);color:#fff;
}
.btn-primary:hover{background:var(--red2);border-color:var(--red2)}
.btn svg{flex-shrink:0;width:14px;height:14px}
.btn-icon{width:14px;height:14px}

/* copy feedback */
.btn.copied{background:rgba(39,174,96,.15);border-color:rgba(39,174,96,.3);color:var(--green)}

/* ── SUBSCRIPTION ACTIONS ── */
.sub-import-block{
  background:rgba(192,57,43,.07);border:1px solid rgba(192,57,43,.2);
  border-radius:10px;padding:14px;margin-bottom:8px;
}
.sub-import-block h4{font-size:13px;font-weight:600;margin-bottom:4px}
.sub-import-block p{font-size:13px;color:var(--muted);margin-bottom:10px}
.sub-url-row{
  display:flex;align-items:center;gap:6px;
  background:var(--bg);border:1px solid var(--border);border-radius:7px;
  padding:8px 10px;margin-bottom:8px;font-size:12px;color:var(--muted);
  word-break:break-all;
}
.sub-url-row code{flex:1;font-family:monospace;color:var(--text);font-size:11px}

/* ── EXPIRED BANNER ── */
.expired-banner{
  background:rgba(192,57,43,.1);border:1px solid rgba(192,57,43,.25);
  border-radius:10px;padding:14px 16px;margin-bottom:12px;
  display:flex;align-items:center;gap:10px;font-size:13px;
}
.expired-banner svg{color:var(--red2);flex-shrink:0}

/* ── RESPONSIVE ── */
@media(max-width:480px){
  .sub-grid{grid-template-columns:1fr 1fr}
  .ctab{min-width:calc(50% - 3px)}
  .step-actions{flex-direction:column}
  .step-actions .btn{width:100%;justify-content:center}
}
</style>
</head>

      + '<button class="btn" onclick="copySub(this)">' + ICO.copy + '<span id="copySubLabel">Скопировать</span></button>'

function importSub(btn) {
  navigator.clipboard.writeText(USER.subUrl);

  btn.classList.add('copied');
  var lbl = document.getElementById('copySubLabel');
  lbl.textContent = 'Скопировано!';
  setTimeout(function(){ btn.classList.remove('copied'); lbl.textContent='Скопировать'; }, 2000);
}

function copySub(btn) {
  navigator.clipboard.writeText(USER.subUrl).then(function(){
    var lbl = document.getElementById('copySubLabel');
    lbl.textContent = 'Скопировано!';
    btn.classList.add('copied');
    setTimeout(function(){ lbl.textContent='Скопировать'; btn.classList.remove('copied'); }, 2000);
  });
}

function copyLink(btn) {
  navigator.clipboard.writeText(window.location.href).then(function(){
    btn.classList.add('copied');
    setTimeout(function(){ btn.classList.remove('copied'); }, 1500);
  });
}

// ── HELPERS ────────────────────────────────────────────────────────────
function formatTs(ts){
    if(!ts||ts<=0)return'—';
    var d=new Date(ts);
    var months=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
    return d.getDate()+' '+months[d.getMonth()]+' '+d.getFullYear();
}

// ── LOAD DATA ──────────────────────────────────────────────────────────
async function loadConnectData(){
    if(!userId||isBrowser)return;
    try{
        var u=window.location.origin;
        var resp=await fetch(u+"/api/user-data?userId="+userId,{headers:{"X-Init-Data":initData}});
        if(resp.ok){
            var data=await resp.json();
            USER.status=data.daysLeft>0?'active':'expired';
            USER.expires=data.subscriptionEnd?formatTs(data.subscriptionEnd):'—';
            USER.subUrl=data.vpnKey||'';
            var dresp=await fetch(u+"/api/user-devices?userId="+userId,{headers:{"X-Init-Data":initData}});
            if(dresp.ok){
                var dev=await dresp.json();
                USER.trafficUsed=((dev.trafficUp||0)+(dev.trafficDown||0))/1073741824;
            }
            renderSub();
            renderInstall();
        }
    }catch(e){console.error(e)}
}

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0e0d0c;
  --surface:rgba(255,255,255,.05);
  --surface2:rgba(255,255,255,.035);
  --border:rgba(255,255,255,.08);
  --text:#e8e6e2;
  --muted:#7a7774;
  --faint:#3a3835;
  --red:#c0392b;
  --red2:#e74c3c;
  --red-glow:rgba(192,57,43,.18);
  --green:#27ae60;
  --yellow:#e67e22;
  --radius:12px;
  --font:'Inter',sans-serif;
  color-scheme:dark;
}
body.theme-light{
  --bg:#f3f2f0;
  --surface:rgba(255,255,255,.58);
  --surface2:rgba(255,255,255,.45);
  --border:rgba(25,20,15,.09);
  --text:#1b1815;
  --muted:#6e6a64;
  --faint:#dcd8d3;
  --red-glow:rgba(192,57,43,.08);
  color-scheme:light;
}
body{transition:background-color .25s ease,color .25s ease}
html{-webkit-font-smoothing:antialiased;scroll-behavior:smooth}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100dvh;font-size:15px;line-height:1.5}

/* ── BACKGROUND: solid + rising particles ── */
.bg-mesh{
  position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
}
.particle{
  position:absolute;bottom:-10px;border-radius:50%;
  background:rgba(255,255,255,.45);
  box-shadow:0 0 8px rgba(255,255,255,.3);
  opacity:0;
  animation:particle-rise var(--p-time,24s) linear infinite;
  animation-delay:var(--p-delay,0s);
  will-change:transform,opacity;
}
.particle-red{
  background:rgba(242,85,90,.75);
  box-shadow:0 0 10px rgba(229,72,77,.55);
}
body.theme-light .particle{background:rgba(25,20,15,.3);box-shadow:0 0 6px rgba(25,20,15,.18)}
body.theme-light .particle-red{background:rgba(229,72,77,.55);box-shadow:0 0 8px rgba(229,72,77,.35)}
@keyframes particle-rise{
  0%{transform:translate3d(0,0,0);opacity:0}
  10%{opacity:1}
  85%{opacity:1}
  100%{transform:translate3d(var(--p-drift,4vw),-105vh,0);opacity:0}
}

/* ── LAYOUT ── */
.wrap{position:relative;z-index:1;max-width:680px;margin:0 auto;padding:0 16px 64px}

/* ── HEADER ── */
header{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 0 16px;
  border-bottom:1px solid var(--border);
  margin-bottom:24px;
}
.brand{display:inline-flex;align-items:center;gap:10px;text-decoration:none}
.brand-text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-weight:800;font-style:italic;font-size:17px;letter-spacing:-0.02em;color:var(--text);line-height:1}
.header-actions{display:flex;gap:8px}
.icon-btn{
  display:flex;align-items:center;justify-content:center;
  width:36px;height:36px;border-radius:8px;
  border:1px solid var(--border);background:var(--surface);
  color:var(--muted);cursor:pointer;
  transition:color .15s,border-color .15s,background .15s;
}
.icon-btn:hover{color:var(--text);border-color:rgba(255,255,255,.15);background:var(--surface2)}

/* ── SUBSCRIPTION CARD ── */
.sub-card{
  background:var(--surface);
  backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:18px;
  margin-bottom:16px;
}
.sub-header{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.sub-avatar{
  width:38px;height:38px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:700;flex-shrink:0;
}
.sub-avatar.expired{background:rgba(192,57,43,.18);color:var(--red2)}
.sub-avatar.active{background:rgba(39,174,96,.18);color:var(--green)}
.sub-info h2{font-size:14px;font-weight:600;margin:0 0 2px}
.sub-info p{font-size:12px;color:var(--muted);margin:0}
.sub-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sub-field{
  background:var(--surface2);border:1px solid var(--border);
  border-radius:8px;padding:10px 12px;
}
.sub-field label{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);margin-bottom:4px}
.sub-field label svg{flex-shrink:0}
.sub-field span{font-size:13px;font-weight:500}
.status-active{color:var(--green)}
.status-expired{color:var(--red2)}
.status-inactive{color:var(--yellow)}

/* Traffic bar */
.traffic-bar{margin-top:6px;height:3px;background:var(--faint);border-radius:2px;overflow:hidden}
.traffic-fill{height:100%;border-radius:2px;background:var(--red2);transition:width .4s}

/* ── SECTION CARD ── */
.section-card{
  background:var(--surface);
  backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);
  border:1px solid var(--border);
  border-radius:var(--radius);padding:18px;margin-bottom:12px;
}
.section-card+.section-card{margin-top:8px}
.section-title-row{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:16px;
}
.section-title{font-size:15px;font-weight:700;letter-spacing:-.01em}

/* ── PLATFORM SELECT ── */
.platform-select{
  display:flex;align-items:center;gap:6px;
  background:var(--surface2);border:1px solid var(--border);
  border-radius:8px;padding:6px 10px;
  font-size:13px;font-weight:500;color:var(--text);
  cursor:pointer;min-width:130px;justify-content:space-between;
  position:relative;
}
.platform-select svg{color:var(--muted);flex-shrink:0}
.plat-icon{width:14px;height:14px;flex-shrink:0}

.plat-dropdown{
  position:absolute;top:calc(100% + 6px);right:0;z-index:100;
  background:#1e1c1a;border:1px solid var(--border);
  border-radius:10px;padding:4px;min-width:150px;
  box-shadow:0 12px 32px rgba(0,0,0,.5);
  display:none;
}
.plat-dropdown.open{display:block}
.plat-opt{
  display:flex;align-items:center;gap:8px;
  padding:8px 10px;border-radius:6px;cursor:pointer;font-size:13px;
  transition:background .12s;
}
.plat-opt:hover{background:var(--surface)}
.plat-opt.active{color:var(--red2)}

/* ── CLIENT TABS ── */
.ctabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.ctab{
  position:relative;overflow:hidden;
  display:flex;align-items:center;gap:8px;
  padding:9px 12px;border-radius:8px;cursor:pointer;
  background:var(--surface2);border:1px solid var(--border);
  font-size:13px;font-weight:500;color:var(--muted);
  transition:all .15s;flex:1;min-width:120px;max-width:calc(50% - 3px);
}
.ctab:hover{color:var(--text);border-color:rgba(255,255,255,.12)}
.ctab.on{
  background:rgba(192,57,43,.1);border-color:rgba(192,57,43,.35);
  color:var(--text);
}
.ctab-dot{
  width:7px;height:7px;border-radius:50%;flex-shrink:0;
  background:var(--faint);
}
.ctab.on .ctab-dot{background:var(--red2)}
.ctab-name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Background logo */
.ctab-logo{
  position:absolute;right:-2px;top:50%;transform:translateY(-50%);
  width:54px;height:54px;opacity:.14;pointer-events:none;
}
.ctab.on .ctab-logo{opacity:.5}
.ctab-logo img{width:54px;height:54px;object-fit:contain;border-radius:10px;display:block}
.ctab-logo svg{width:54px;height:54px;color:var(--text)}

/* ── STEP CARDS ── */
.step-card{
  background:var(--surface2);border:1px solid var(--border);
  border-radius:10px;padding:16px;margin-bottom:8px;
}
.step-card:last-child{margin-bottom:0}
.step-header{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.step-icon{
  width:36px;height:36px;border-radius:9px;flex-shrink:0;
  background:rgba(192,57,43,.12);border:1px solid rgba(192,57,43,.2);
  display:flex;align-items:center;justify-content:center;color:var(--red2);
}
.step-title{font-size:13px;font-weight:600}
.step-desc{font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:10px}
.step-actions{display:flex;flex-wrap:wrap;gap:6px}

/* ── BUTTONS ── */
.btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:8px 14px;border-radius:7px;font-size:13px;font-weight:500;
  cursor:pointer;border:1px solid var(--border);
  background:var(--surface);color:var(--text);
  transition:all .15s;text-decoration:none;white-space:nowrap;
}
.btn:hover{background:var(--surface2);border-color:rgba(255,255,255,.15)}
.btn-primary{
  background:var(--red);border-color:var(--red);color:#fff;
}
.btn-primary:hover{background:var(--red2);border-color:var(--red2)}
.btn svg{flex-shrink:0;width:14px;height:14px}
.btn-icon{width:14px;height:14px}

/* copy feedback */
.btn.copied{background:rgba(39,174,96,.15);border-color:rgba(39,174,96,.3);color:var(--green)}

/* ── SUBSCRIPTION ACTIONS ── */
.sub-import-block{
  background:rgba(192,57,43,.07);border:1px solid rgba(192,57,43,.2);
  border-radius:10px;padding:14px;margin-bottom:8px;
}
.sub-import-block h4{font-size:13px;font-weight:600;margin-bottom:4px}
.sub-import-block p{font-size:13px;color:var(--muted);margin-bottom:10px}
.app-not-found{display:none;margin-top:10px;padding:10px 12px;background:rgba(241,196,15,.1);border:1px solid rgba(241,196,15,.25);border-radius:8px;font-size:13px;color:#f1c40f;text-align:center}
.app-not-found a{color:#f1c40f;font-weight:700;text-decoration:underline}
.app-not-found-hint{font-size:11px;opacity:.7;margin-top:4px}
.app-not-found.show{display:block}

/* ── EXPIRED BANNER ── */
.expired-banner{
  background:rgba(192,57,43,.1);border:1px solid rgba(192,57,43,.25);
  border-radius:10px;padding:14px 16px;margin-bottom:12px;
  display:flex;align-items:center;gap:10px;font-size:13px;
}
.expired-banner svg{color:var(--red2);flex-shrink:0}

/* ── RESPONSIVE ── */
@media(max-width:480px){
  .sub-grid{grid-template-columns:1fr 1fr}
  .ctab{min-width:calc(50% - 3px)}
  .step-actions{flex-direction:column}
  .step-actions .btn{width:100%;justify-content:center}
}
</style>
</head>

function renderPlatDropdown() {
  var dd = document.getElementById('platDropdown');
  dd.innerHTML = PLATFORMS.map(function(p) {
    return '<div class="plat-opt' + (p.id === state.platId ? ' active' : '') + '" onclick="selectPlat(\'' + p.id + '\')">'
      + p.label + '</div>';
  }).join('');
}

function togglePlatDropdown() {
  var dd = document.getElementById('platDropdown');
  dd.classList.toggle('open');
  renderPlatDropdown();
}

function selectPlat(id) {
  state.platId = id;
  var plat = PLATFORMS.find(function(p){return p.id===id;});
  state.appId = plat.apps[0].id;
  document.getElementById('platLabel').textContent = plat.label;
  document.getElementById('platDropdown').classList.remove('open');
  renderInstall();
}

// close dropdown on outside click
document.addEventListener('click', function(e) {

    document.getElementById('platDropdown').classList.remove('open');
  }
});

var INCY_KEYMAT_B_OFFSET = 2048;
var INCY_KEYMAT_LEN = 32;

var INcyKeyCache = null;
var INcyReady = false;
var INcyDeriving = null;

function b64url(data) {
  var b64 = btoa(String.fromCharCode.apply(null, data));
  return b64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

function deriveIncyKey() {
  if (INcyDeriving) return INcyDeriving;
  try {
    INcyDeriving = (async function() {
      var a = Uint8Array.from(atob(INCY_KEYMAT_A), function(c){ return c.charCodeAt(0); });
      var b = Uint8Array.from(atob(INCY_KEYMAT_B), function(c){ return c.charCodeAt(0); });
      var kmA = a.subarray(INCY_KEYMAT_A_OFFSET, INCY_KEYMAT_A_OFFSET + INCY_KEYMAT_LEN);
      var kmB = b.subarray(INCY_KEYMAT_B_OFFSET, INCY_KEYMAT_B_OFFSET + INCY_KEYMAT_LEN);
      var enc = new TextEncoder();
      var seedParts = [enc.encode('incy'), enc.encode('deep'), enc.encode('crypt1'), enc.encode('v2026.06')];
      var totalLen = 0;
      seedParts.forEach(function(p){ totalLen += p.length; });
      totalLen += INCY_KEYMAT_LEN * 2;
      var seed = new Uint8Array(totalLen);
      var off = 0;
      seedParts.forEach(function(p){ seed.set(p, off); off += p.length; });
      seed.set(kmA, off); off += INCY_KEYMAT_LEN;
      seed.set(kmB, off);
      var keyBytes = await crypto.subtle.digest('SHA-256', seed);
      INcyKeyCache = await crypto.subtle.importKey('raw', keyBytes, { name: 'AES-GCM' }, false, ['encrypt']);
      INcyReady = true;
    })();
  } catch(e) {}
  return INcyDeriving;
}
deriveIncyKey();

async function makeIncyDeepLink(url) {
  if (!INcyReady) {
    try { await INcyDeriving; } catch(e) { return 'incy://import/' + url; }
  }
  try {
    var iv = crypto.getRandomValues(new Uint8Array(12));
    var plaintext = new TextEncoder().encode(JSON.stringify({url: url, v: 1}));
    var encrypted = await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, INcyKeyCache, plaintext);
    var encBytes = new Uint8Array(encrypted);
    var wire = new Uint8Array(12 + encBytes.length);
    wire.set(iv, 0);
    wire.set(encBytes, 12);
    return 'incy://crypt1/' + b64url(wire);
  } catch(e) {
    return 'incy://import/' + url;
  }
}

var CLASH_APPS = ['clashmi', 'flclashx'];

function vlessToYaml(text) {
  var lines;
  try { lines = atob(text).split('\n'); }
  catch(e) { lines = text.split('\n'); }
  var proxies = [];
  for (var i = 0; i < lines.length; i++) {
    var link = lines[i].trim();
    if (!link || link.charAt(0) === '#') continue;
    if (link.indexOf('vless://') !== 0 && link.indexOf('vmess://') !== 0 && link.indexOf('ss://') !== 0 && link.indexOf('trojan://') !== 0) continue;
    try {
      var u = new URL(link);
      var name = (u.hash.slice(1) || '').slice(0, 32) || u.hostname;
      var p = { name: decodeURIComponent(name), server: u.hostname, port: parseInt(u.port) || 443 };
      if (link.indexOf('vless://') === 0) {
        p.type = 'vless'; p.uuid = u.username;
        u.searchParams.forEach(function(v, k) {
          if (k === 'type') p.network = v;
          else if (k === 'flow') p.flow = v;
          else if (k === 'sni') p.sni = v;
          else if (k === 'fp') p['client-fingerprint'] = v;
          else if (k === 'security' && (v === 'tls' || v === 'reality')) p.tls = true;
          else if (k === 'pbk') { p['reality-opts'] = p['reality-opts'] || {}; p['reality-opts']['public-key'] = v; }
          else if (k === 'sid') { p['reality-opts'] = p['reality-opts'] || {}; p['reality-opts']['short-id'] = v; }
        });
        if (!p.network) p.network = 'tcp';
      } else if (link.indexOf('vmess://') === 0) {
        p.type = 'vmess';
        var raw = link.slice(8);
        if (raw.indexOf('#') !== -1) raw = raw.slice(0, raw.indexOf('#'));
        try {
          var d = JSON.parse(atob(raw));
          p.uuid = d.id || ''; p.alterId = d.aid || 0; p.cipher = d.scy || 'auto';
          if (d.tls) p.tls = true; p.network = d.net || 'tcp';
          if (d.net === 'ws' && d.path) {
            p['ws-opts'] = { path: d.path };
            if (d.host) p['ws-opts'].headers = { Host: d.host };
          }
        } catch(e) { continue; }
      } else if (link.indexOf('ss://') === 0) {
        p.type = 'ss';
        var raw = link.slice(5);
        if (raw.indexOf('#') !== -1) raw = raw.slice(0, raw.indexOf('#'));
        try {
          var dec = atob(raw);
          var atIdx = dec.lastIndexOf('@');
          if (atIdx === -1) continue;
          var pwd = dec.slice(0, atIdx).split(':');
          p.cipher = pwd[0] || 'chacha20-ietf-poly1305'; p.password = pwd.slice(1).join(':') || '';
          var hp = dec.slice(atIdx + 1).split(':');
          p.server = hp[0]; p.port = parseInt(hp[1]) || 443;
        } catch(e) { continue; }
      } else if (link.indexOf('trojan://') === 0) {
        p.type = 'trojan'; p.password = u.username; p.udp = true;
        u.searchParams.forEach(function(v, k) {
          if (k === 'sni' || k === 'peer') p.sni = v;
          else if (k === 'allowInsecure' && (v === '1' || v === 'true')) p['skip-cert-verify'] = true;
        });
      }
      if (p.type) proxies.push(p);
    } catch(e) {}
  }
  if (!proxies.length) return null;

  var y = 'port: 7890\nsocks-port: 7891\nallow-lan: true\nmode: Rule\nlog-level: info\n\nproxies:\n';
  for (var i = 0; i < proxies.length; i++) {
    var p = proxies[i];
    y += '  - name: "' + p.name + '"\n    type: ' + p.type + '\n    server: ' + p.server + '\n    port: ' + p.port + '\n';
    if (p.type === 'vless') {
      y += '    uuid: ' + p.uuid + '\n';
      if (p.flow) y += '    flow: ' + p.flow + '\n';
      if (p.tls) y += '    tls: true\n';
      if (p.sni) y += '    sni: ' + p.sni + '\n';
      if (p['client-fingerprint']) y += '    client-fingerprint: ' + p['client-fingerprint'] + '\n';
      if (p['reality-opts']) {
        y += '    reality-opts:\n      public-key: ' + p['reality-opts']['public-key'] + '\n';
        if (p['reality-opts']['short-id']) y += '      short-id: ' + p['reality-opts']['short-id'] + '\n';
      }
      y += '    network: ' + p.network + '\n';
    } else if (p.type === 'vmess') {
      y += '    uuid: ' + p.uuid + '\n    alterId: ' + p.alterId + '\n    cipher: ' + p.cipher + '\n';
      if (p.tls) y += '    tls: true\n';
      if (p.network && p.network !== 'tcp') y += '    network: ' + p.network + '\n';
      if (p['ws-opts']) {
        y += '    ws-opts:\n      path: "' + p['ws-opts'].path + '"\n';
        if (p['ws-opts'].headers) y += '      headers:\n        Host: ' + p['ws-opts'].headers.Host + '\n';
      }
    } else if (p.type === 'ss') {
      y += '    cipher: ' + p.cipher + '\n    password: "' + p.password + '"\n';
    } else if (p.type === 'trojan') {
      y += '    password: "' + p.password + '"\n    udp: true\n';
      if (p.sni) y += '    sni: ' + p.sni + '\n';
      if (p['skip-cert-verify']) y += '    skip-cert-verify: true\n';
    }
  }
  var names = proxies.map(function(p){ return '"' + p.name + '"'; });
  y += 'proxy-groups:\n  - name: Proxy\n    type: select\n    proxies:\n      - Auto\n      - DIRECT\n';
  for (var i = 0; i < names.length; i++) y += '      - ' + names[i] + '\n';
  y += '  - name: Auto\n    type: url-test\n    url: http://www.gstatic.com/generate_204\n    interval: 300\n    proxies:\n';
  for (var i = 0; i < names.length; i++) y += '      - ' + names[i] + '\n';
  y += '  - name: DIRECT\n    type: select\n    proxies:\n      - DIRECT\n\nrules:\n  - MATCH,Proxy\n';

  return y;
}

async function importSub(btn) {
  var url = USER.subUrl;
  var deepLink = null;

  if (CLASH_APPS.indexOf(state.appId) !== -1) {
    var yaml = null;
    if (USER.subContent) {
      yaml = vlessToYaml(USER.subContent);
    }
    if (!(yaml && yaml.length > 100)) {
      try {
        var resp = await fetch(SUB_CONVERTER_URL);
        if (resp.ok) yaml = await resp.text();
      } catch(e) {}
    }
    if (yaml && yaml.length > 50) {
      try {
        var resp = await fetch(window.location.origin + '/api/sub-store', {method: 'POST', body: yaml});
        if (resp.ok) {
          var data = await resp.json();
          if (data.token) url = window.location.origin + '/api/sub-store/' + data.token;
        }
      } catch(e) {}
      if (url.indexOf('/api/sub-store/') === -1) {
        var b64 = btoa(unescape(encodeURIComponent(yaml)));
        url = 'data:text/yaml;charset=utf-8;base64,' + b64;
      }
      var blob = new Blob([yaml], {type: 'text/yaml'});
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'blackvpn.yaml';
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); document.body.removeChild(a); }, 500);
    }
  }

  var scheme = APP_SCHEMES[state.appId];
  if (typeof scheme === 'function') {
    deepLink = await scheme(url);
    if (!deepLink) deepLink = url;
  } else if (scheme) {
    if (scheme.indexOf('?url=') !== -1) {
      deepLink = scheme + encodeURIComponent(url);
    } else {
      deepLink = scheme + url;
    }
  } else {
    deepLink = url;
  }

  navigator.clipboard.writeText(deepLink);

  var notFound = document.getElementById('app-not-found');
  notFound.classList.remove('show');

  var appOpened = false;
  var onVisibility = function(){
    if (document.hidden || document.webkitHidden) {
      appOpened = true;
      document.removeEventListener('visibilitychange', onVisibility);
      document.removeEventListener('webkitvisibilitychange', onVisibility);
    }
  };
  document.addEventListener('visibilitychange', onVisibility);
  document.addEventListener('webkitvisibilitychange', onVisibility);

  var plat = PLATFORMS.find(function(p){return p.id===state.platId;});
  var app = plat.apps.find(function(a){return a.id===state.appId;}) || plat.apps[0];
  var installUrl = app.install.btns && app.install.btns.length > 0 ? app.install.btns[0].url : '';

  setTimeout(function(){
    document.removeEventListener('visibilitychange', onVisibility);
    document.removeEventListener('webkitvisibilitychange', onVisibility);
    if (!appOpened) {
      var link = document.getElementById('app-install-link');
      link.href = installUrl;
      notFound.classList.add('show');
    }
  }, 1500);

  var a = document.createElement('a');
  a.href = deepLink;
  a.target = '_blank';
  a.rel = 'noopener';
  a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){ document.body.removeChild(a); }, 500);

  btn.classList.add('copied');
  var lbl = document.getElementById('copySubLabel');
  lbl.textContent = 'Скопировано!';
  setTimeout(function(){ btn.classList.remove('copied'); lbl.textContent='Скопировать'; }, 2000);
}

async function copySub(btn) {
  var url = USER.subUrl;
  var scheme = APP_SCHEMES[state.appId];
  var copyUrl = url;
  if (typeof scheme === 'function') {
    var dl = await scheme(url);
    if (dl) copyUrl = dl;
  } else if (scheme) {
    if (scheme.indexOf('?url=') !== -1) {
      copyUrl = scheme + encodeURIComponent(url);
    } else {
      copyUrl = scheme + url;
    }
  }
  navigator.clipboard.writeText(copyUrl).then(function(){
    var lbl = document.getElementById('copySubLabel');
    lbl.textContent = 'Скопировано!';
    btn.classList.add('copied');
    setTimeout(function(){ lbl.textContent='Скопировать'; btn.classList.remove('copied'); }, 2000);
  });
}

async function copyLink(btn) {
  if (!USER.subUrl) return;
  try {
    await navigator.clipboard.writeText(USER.subUrl);
    btn.classList.add('copied');
    setTimeout(function(){ btn.classList.remove('copied'); }, 1500);
  } catch(e) {}
}

function formatTs(ts){
    if(!ts||ts<=0)return'—';
    var d=new Date(ts);
    var months=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
    return d.getDate()+' '+months[d.getMonth()]+' '+d.getFullYear();
}

// ── LOAD DATA ──────────────────────────────────────────────────────────
async function loadConnectData(){
    if(!userId||isBrowser)return;
    try{
        var u=window.location.origin;
        var resp=await fetch(u+"/api/user-data?userId="+userId+"&withSub=1",{headers:{"X-Init-Data":initData}});
        if(resp.ok){
            var data=await resp.json();
            USER.status=data.daysLeft>0||data.subscriptionEnd>Date.now()?'active':'expired';
            USER.expires=data.subscriptionEnd?formatTs(data.subscriptionEnd):'—';
            USER.subUrl=data.vpnKey||'';
            USER.subContent=data.subContent||'';
            var dresp=await fetch(u+"/api/user-devices?userId="+userId,{headers:{"X-Init-Data":initData}});
            if(dresp.ok){
                var dev=await dresp.json();
                USER.trafficUsed=((dev.trafficUp||0)+(dev.trafficDown||0))/1073741824;
            }
            renderSub();
            renderInstall();
        }
    }catch(e){console.error(e)}
}

}
